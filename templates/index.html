<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Finder</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>🔍 Professional Email Finder</h1>
        <p class="subtitle">Find and verify professional email addresses without paid APIs</p>

        <div class="form-container">
            <form id="emailForm">
                <div class="form-group">
                    <label for="firstName">Full Name</label>
                    <input type="text" id="firstName" name="first_name" placeholder="John" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="last_name" placeholder="Doe" required>
                </div>

                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" name="company_name" placeholder="Acme Inc" required>
                </div>

                <div class="form-group">
                    <label>Verification Method</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="verifyDNS" name="verify_method" value="dns" checked>
                            <label for="verifyDNS">DNS (Faster, no SMTP)</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="verifySMTP" name="verify_method" value="smtp">
                            <label for="verifySMTP">SMTP (Slower, more accurate)</label>
                        </div>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="showAll" name="show_all">
                    <label for="showAll">Show all candidates</label>
                </div>

                <button type="submit" id="findEmailBtn">
                    <i class="fas fa-search"></i> Find Email
                </button>
            </form>
        </div>

        <div id="loading" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
            <p>Checking email patterns... This may take a few seconds</p>
        </div>

        <div id="results" class="results-container" style="display: none;">
            <h2>Results</h2>

            <div id="bestResult" class="result-card">
                <div class="result-header">
                    <h3>Best Email Found</h3>
                    <span id="statusBadge" class="status-badge"></span>
                </div>

                <div class="result-content">
                    <div class="email-display">
                        <span id="bestEmail"></span>
                        <button class="copy-btn" onclick="copyToClipboard()">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </div>

                    <div class="result-details">
                        <p><strong>Pattern:</strong> <span id="patternUsed"></span></p>
                        <p><strong>Domain:</strong> <span id="domainResolved"></span></p>
                    </div>
                </div>
            </div>

            <div id="allCandidates" class="candidates-list" style="display: none;">
                <h3>All Candidates Tried</h3>
                <div id="candidatesContainer"></div>
            </div>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText"></span>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
